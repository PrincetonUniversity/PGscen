name: CI (Docker-based)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check release smoke test code
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -r test/requirements-checks.txt
          .venv/bin/ruff --isolated check setup.py test/test_console_scripts.py
          .venv/bin/ruff --isolated format --check test/test_console_scripts.py
          .venv/bin/mypy --strict test/test_console_scripts.py

  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t pgscen-test -f Dockerfile .

      - name: Run tests inside container
        run: |
          # Run the tests from the image's internal /tmp/buildworkspace (created at image build time)
          # This avoids mounting the GitHub workspace, which can lead to permission issues
          docker run --rm -e PYTHONPATH=/tmp/buildworkspace pgscen-test \
            bash -c "MAMBA_CACHE_DIR=/tmp/mamba HOME=/tmp micromamba run -n pgscen bash /tmp/buildworkspace/test/test_run.sh"
